[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triathlon-planner"
version = "0.2.0"
description = "Triathlon Workout & Season Planner with HiGHS MILP and Closed-Loop Model Predictive Control"
readme = "ReadMe.md"
requires-python = ">=3.10"
dependencies = [
    "highspy",
    "pandas",
    "numpy",
    "openpyxl",
    "requests",
    "beautifulsoup4",
    "python-dotenv",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
