[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triathlon-planner"
version = "0.2.0"
description = "Triathlon Workout & Season Planner with HiGHS MILP and Closed-Loop Model Predictive Control"
readme = "ReadMe.md"
requires-python = ">=3.10"
dependencies = [
    "highspy",
    "pandas",
    "numpy",
    "openpyxl",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "pydantic>=2",
    "pandera>=0.20",
    "PyYAML>=6",
    "tqdm>=4.66",  # progress bar for TrainingPeaks sync (triplan.io.trainingpeaks)
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Garmin Connect Personal API client (scripts/sync_garmin_data.py); import name: garmin_personal_api
garmin = ["garmin-connect-personal-api-python>=1.0"]

[project.scripts]
triplan = "triplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["triplan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
